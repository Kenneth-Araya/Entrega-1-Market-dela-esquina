<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilosLogin.css">
    <script src="js/appRegistro.js" defer></script>

</head>

<body>
    <main>
        <!--Formulario de registro-->
        <section id="seccion-registro" class="py-5">
            <div class="container">
                <div class="row justify-content-center">

                    <div class="col-12 col-md-9 col-lg-7">
                        <form action="" method="" id="formulario-registro" class="border rounded p-4 shadow bg-white">
                            <h2 class="text-center mb-4">Registro</h2>

                            <div class="mb-3">
                                <label for="run" class="form-label">RUN (sin puntos ni guion)</label>
                                <input type="text" id="run" class="form-control" maxlength="9" placeholder="19011022K"
                                    autocomplete="off">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="nombre" class="form-label">Nombre</label>
                                    <input type="text" id="nombre" class="form-control" maxlength="50"
                                        placeholder="Ingrese su nombre" autocomplete="given-name">
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellidos" class="form-label">Apellidos</label>
                                    <input type="text" id="apellidos" class="form-control" maxlength="100"
                                        placeholder="Ingrese sus apellidos" autocomplete="family-name">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" id="correo" class="form-control" maxlength="100"
                                    placeholder="nombre@correo.cl" autocomplete="email">
                            </div>

                            <div class="mb-3">
                                <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento (opcional)</label>
                                <input type="date" id="fecha-nacimiento" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="tipo-usuario" class="form-label">Tipo de usuario</label>
                                <select id="tipo-usuario" class="form-select">
                                    <option value="" selected disabled>Selecciona un tipo de usuario</option>
                                    <option value="Administrador">Administrador</option>
                                    <option value="Cliente">Cliente</option>
                                    <option value="Vendedor">Vendedor</option>
                                </select>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="region" class="form-label">Región</label>
                                    <select id="region" class="form-select">
                                        <option value="" selected disabled>Selecciona una región</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="comuna" class="form-label">Comuna</label>
                                    <select id="comuna" class="form-select">
                                        <option value="" selected disabled>Selecciona primero una región</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="direccion" class="form-label">Dirección</label>
                                <textarea id="direccion" class="form-control" maxlength="300" rows="2"
                                    placeholder="Calle, número, depto/casa"></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" id="contrasena" class="form-control"
                                    placeholder="Ingrese contraseña" autocomplete="new-password">
                            </div>
                            <div class="mb-3">
                                <label for="confirmar-contrasena" class="form-label">Confirmar contraseña</label>
                                <input type="password" id="confirmar-contrasena" class="form-control"
                                    placeholder="Repita su contraseña" autocomplete="new-password">
                            </div>

                            <div id="mensaje-resultado" class="mt-3" role="alert"></div>

                            <button type="submit" class="btn btn-morado w-100 mt-4">Registrarme</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <footer id="contacto" class="bg-dark text-light text-center py-3">
        <div class="container">
            <p class="mb-1">Venta de comestibles - Viña del Mar</p>
            <p class="mb-0">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
