<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilosLogin.css">
    <script src="js/appRegistro.js" defer></script>
 
</head>
 
<body>
    <main>
        <!--Formulario de registro-->
        <section id="formulario-Registro" class="py-5">
            <div class="container">
                <div class="row justify-content-center">
 
                    <div class="col-12 col-md-8 col-lg-6">
                        <form action="" method="" id="formulario-registro" class="border rounded p-4 shadow bg-white">
                            <div class="mb-3">
                                <h2 class="text-center mb-4">Registro</h2>
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" id="nombre" class="form-control" placeholder="Ingrese su nombre">
                            </div>
                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo electrónico</label>
                                <input type="email" id="correo" class="form-control" placeholder="nombre@correo.cl">
                            </div>
                            <div class="mb-3">
                                <label for="repetir-correo" class="form-label">Repetir correo electrónico</label>
                                <input type="email" id="repetir-correo" class="form-control" placeholder="Repita su correo">
                            </div>
                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña</label>
                                <input type="password" id="contrasena" class="form-control" placeholder="Ingrese contraseña">
                            </div>
                            <div class="mb-3">
                                <label for="confirmar-contrasena" class="form-label">Confirmar contraseña</label>
                                <input type="password" id="confirmar-contrasena" class="form-control" placeholder="Repita su contraseña">
                            </div>
 
                            <div id="mensaje-resultado" class="mt-3" role="alert"></div>
 
                            <button type="submit" class="btn btn-morado w-100 mt-5">Registrarme</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
        </script>
    <footer id="contacto" class="bg-dark text-light text-center py-3">
        <div class="container">
            <p class="mb-1">Venta de comestibles - Viña del Mar</p>
            <p class="mb-0">&copy; 2026 Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
