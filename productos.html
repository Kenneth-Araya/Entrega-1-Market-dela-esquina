<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Market De La Esquina</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilosHome.css">

    <!-- Usamos el mismo script para que renderice los productos y maneje el carrito -->
    <script src="js/appHome.js" defer></script>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg container py-3">
            <!-- Logo y Nombre -->
            <a class="navbar-brand brand d-flex align-items-center gap-2 fw-bold" href="home.html">
                <span class="brand-icon">🛒</span> Market De La Esquina
            </a>

            <!-- Vista Móvil: Carrito y botón hamburguesa -->
            <div class="d-flex align-items-center gap-3 d-lg-none">
                <a href="carrito.html" class="text-decoration-none text-dark fs-5">🛒</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>

            <!-- Menú Desplegable -->
            <div class="collapse navbar-collapse" id="navMenu">
                
                <!-- Enlaces Centrados -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4 text-center mt-3 mt-lg-0">
                    <li class="nav-item"><a class="nav-link active" href="home.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#categorias">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="#productos">Tienda</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
                </ul>

                <!-- Botones de la Derecha (Buscador, Iniciar Sesión y 1 solo Carrito) -->
                <div class="d-flex flex-column flex-lg-row align-items-center gap-3 mt-3 mt-lg-0">
                    <div class="search-box d-none d-md-flex align-items-center bg-light px-3 py-1 rounded-pill">
                        <span class="me-2">🔍</span>
                        <input type="text" placeholder="Buscar" aria-label="Buscar" style="border: none; background: transparent; outline: none;">
                    </div>
                    <button class="btn btn-signup text-white px-4 rounded-pill" style="background-color: #371e54;">Iniciar Sesion</button>
                    
                    <!-- Vista Escritorio: El único carrito de la derecha -->
                    <a href="carrito.html" class="d-none d-lg-block text-decoration-none text-dark fs-5 ms-2">🛒</a>
                </div>
            </div>
        </nav>
    </header>

    <!-- Contenido Principal: Cuadros pequeños con la lista de productos -->
    <main class="container my-5" id="productos">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title mb-3 mb-md-0">Todos Nuestros Productos</h2>
        </div>

        <div id="contenedor-productos" class="row g-4"></div>
    </main>
    
    <footer class="bg-dark text-light pt-4 pb-3 mt-5">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Market De La Esquina. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
