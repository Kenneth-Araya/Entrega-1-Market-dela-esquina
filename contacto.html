<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Market De La Esquina</title>

    <!-- Corregido: un solo rel="stylesheet" -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- 1. EL CSS GLOBAL (Pinta el Navbar y el Footer igual que en el Home) -->
    <link rel="stylesheet" href="css/estilosHome.css">

    <!-- Tu CSS principal -->
    <link rel="stylesheet" href="css/estiloContacto.css">

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg container py-3">
            <a class="navbar-brand brand" href="#">
                <span class="brand-icon"></span> Market De La Esquina
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-between" id="navMenu">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                    <li class="nav-item"><a class="nav-link active" href="home.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3 mt-3 mt-lg-0">
                    <a href="carrito.html"
                        class="icon-btn position-relative text-decoration-none d-flex align-items-center justify-content-center"
                        aria-label="Carrito">
                        <span style="font-size: 1.3rem;">🛒</span>
                        <span id="cart-badge"
                            class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none"
                            style="font-size: 0.75rem; border: 2px solid white;">
                            0
                        </span>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">

        <div class="text-center mb-5">
            <img src="img/logoMarket.jpg" alt="Logo Market de la Esquina" id="logo-contacto">
            <h2>Minimarket de la Esquina</h2>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="caja-formulario">
                    <div class="encabezado-formulario text-center">
                        <p>FORMULARIO DE CONTACTO</p>
                    </div>

                    <div class="cuerpo-formulario p-4">
                        <form id="formContacto">

                            <!--CAMPO NOMBRE-->
                            <div class="mb-3">
                                <label for="nombre">NOMBRE COMPLETO</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Bairon Valencia">
                            </div>

                            <!--CAMPO CORREO-->
                            <div class="mb-3">
                                <label for="correo">CORREO</label>
                                <input type="email" class="form-control" id="correo" placeholder="bairon@duoc.cl">
                            </div>

                            <!--CAMPO CONTENIDO-->
                            <div class="mb-4">
                                <label for="contenido">CONTENIDO</label>
                                <textarea class="form-control" id="contenido" rows="8"
                                    placeholder="Escribe todos los detalles aquí..."></textarea>
                            </div>

                            <!--BOTON PARA ENVIAR-->
                            <div class="text-center mt-4">
                                <button type="button" id="btnEnviar" class="btn btn-outline-dark">ENVIAR
                                    MENSAJE</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/appContacto.js"></script>
</body>

</html>
