<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Market De La Esquina</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilosHome.css">

</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg container py-3">
            <a href="navbar-brand brand" href="home.html">
                <span class="brand-icon">🛒</span> Market De La Esquina
            </a>
            <div class="ms-auto">
                <a href="productos.html" class="btn btn-outline-secondary btn-sm">← Seguir Comprando</a>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="section-title mb-4">Tu Carrito de Compras</h2>

        <div class="row g-4">
            <!-- Lista de productos en el carrito -->
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 p-3">
                    <div id="contenedor-carrito-items">
                        <!-- JavaScript cargará los ítems aquí -->
                    </div>
                </div>
            </div>

            <!-- Resumen de pago -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-4 bg-light">
                    <h5 class="fw-bold mb-3">Resumen de la Orden</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span>Subtotal</span>
                        <span id="subtotal-carrito" class="fw-bold">$0</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4">
                        <span class="fs-5 fw-bold">TOTAL</span>
                        <span id="total-carrito" class="fs-5 fw-bold text-success">$0</span>
                    </div>
                    <button class="btn btn-primary w-100 mb-2" onclick="finalizarCompra()">Finalizar Venta</button>
                    <button class="btn btn-outline-danger w-100 btn-sm" onclick="limpiarCarrito()">Vaciar Carrito</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Script para renderizar el carrito -->
    <script>
        function cargarCarrito() {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            const contenedor = document.getElementById("contenedor-carrito-items");
            const subtotalEl = document.getElementById("subtotal-carrito");
            const totalEl = document.getElementById("total-carrito");

            contenedor.innerHTML = "";

            if (carrito.length === 0) {
                contenedor.innerHTML = `<p class="text-muted text-center py-4">Tu carrito está vacío.</p>`;
                subtotalEl.innerText = "$0";
                totalEl.innerText = "$0";
                return;
            }

            let subtotalTotal = 0;

            carrito.forEach(function(producto, index) {
                let cantidad = producto.cantidad || 1;
                let subtotalProducto = producto.precio * cantidad;
                subtotalTotal += subtotalProducto;

                const itemDiv = document.createElement("div");
                itemDiv.className = "d-flex align-items-center justify-content-between border-bottom py-3";

                itemDiv.innerHTML = `
                    <div class="d-flex align-items-center gap-3">
                        <img src="${producto.imagen}" alt="${producto.nombre}" style="width: 60px; height: 60px; object-fit: contain;" class="bg-light rounded p-1">
                        <div>
                            <h6 class="fw-bold mb-1">${producto.nombre}</h6>
                            <small class="text-muted">Precio: $${producto.precio} | Cantidad: ${cantidad}</small>
                        </div>
                    </div>
                    <div class="text-end">
                        <span class="fw-bold text-success d-block mb-1">$${subtotalProducto}</span>
                        <button class="btn btn-sm btn-outline-danger" onclick="eliminarItem(${index})">🗑️</button>
                    </div>
                `;
                contenedor.appendChild(itemDiv);
            });

            subtotalEl.innerText = `$${subtotalTotal}`;
            totalEl.innerText = `$${subtotalTotal}`;
        }

        function eliminarItem(index) {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            carrito.splice(index, 1);
            localStorage.setItem("carrito", JSON.stringify(carrito));
            cargarCarrito();
        }

        function limpiarCarrito() {
            localStorage.removeItem("carrito");
            cargarCarrito();
        }

        function finalizarCompra() {
            let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }
            alert("¡Compra finalizada con éxito! Gracias por comprar en Market De La Esquina.");
            localStorage.removeItem("carrito");
            cargarCarrito();
        }

        document.addEventListener("DOMContentLoaded", cargarCarrito);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
