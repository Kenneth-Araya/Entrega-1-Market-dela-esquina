<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - Market De La Esquina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilosHome.css">
    <link rel="stylesheet" href="css/estiloAdmin.css">
    <script src="js/appAdmin.js" defer></script>
    <script src="js/appConfiguracionAdmin.js" defer></script>
</head>
<body class="admin-body">
    <div class="admin-layout">

        <!-- ===== SIDEBAR ===== -->
        <aside class="admin-sidebar">
            <a href="home.html" class="admin-brand">
                <span class="brand-icon"></span> Market De La Esquina
            </a>

            <ul class="admin-nav">
                <li><a class="admin-nav-link" href="admin.html" data-pagina="admin.html">Inicio</a></li>
                <li><a class="admin-nav-link" href="productosAdmin.html" data-pagina="productosAdmin.html">Productos</a></li>
                <li><a class="admin-nav-link" href="usuariosAdmin.html" data-pagina="usuariosAdmin.html">Usuarios</a></li>
                <li><a class="admin-nav-link" href="ventasAdmin.html" data-pagina="ventasAdmin.html">Ventas</a></li>
                <li><a class="admin-nav-link" href="reportesAdmin.html" data-pagina="reportesAdmin.html">Reportes</a></li>
                <li><a class="admin-nav-link active" href="configuracionAdmin.html" data-pagina="configuracionAdmin.html">Configuracion</a></li>
            </ul>

            <div class="admin-logout">
                <a href="#" id="boton-logout" class="admin-nav-link">Cerrar sesión</a>
            </div>
        </aside>

        <!-- ===== CONTENIDO ===== -->
        <div class="admin-contenido">

            <!-- Topbar -->
            <div class="admin-topbar">
                <h5 class="mb-0">Configuración</h5>
                <div class="admin-topbar-user">
                    <span class="fs-5" aria-label="Notificaciones"></span>
                    <div class="d-flex align-items-center gap-2">
                        <div class="admin-avatar">A</div>
                        <span>Admin</span>
                    </div>
                </div>
            </div>

            <!-- Main -->
            <main class="admin-main">
                <h2 class="section-title">Configuración de la tienda</h2>

                <div class="admin-form-card">
                    <form id="formulario-configuracion">
                        <div class="mb-3">
                            <label for="nombre-tienda" class="form-label">Nombre de la tienda</label>
                            <input type="text" id="nombre-tienda" class="form-control" maxlength="100"
                                placeholder="Market De La Esquina">
                        </div>

                        <div class="mb-3">
                            <label for="correo-contacto" class="form-label">Correo de contacto</label>
                            <input type="email" id="correo-contacto" class="form-control" maxlength="100"
                                placeholder="contacto@marketdelaesquina.cl">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="telefono-contacto" class="form-label">Teléfono de contacto</label>
                                <input type="tel" id="telefono-contacto" class="form-control" maxlength="20"
                                    placeholder="+56 9 1234 5678">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="moneda" class="form-label">Moneda</label>
                                <select id="moneda" class="form-select">
                                    <option value="CLP" selected>Peso chileno (CLP)</option>
                                    <option value="USD">Dólar estadounidense (USD)</option>
                                    <option value="EUR">Euro (EUR)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="direccion-tienda" class="form-label">Dirección de la tienda</label>
                            <textarea id="direccion-tienda" class="form-control" maxlength="300" rows="2"
                                placeholder="Calle, número, comuna"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="horario-atencion" class="form-label">Horario de atención</label>
                            <input type="text" id="horario-atencion" class="form-control" maxlength="100"
                                placeholder="Lunes a sábado, 9:00 - 20:00">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="notificaciones-ventas">
                            <label class="form-check-label" for="notificaciones-ventas">
                                Recibir notificaciones de nuevas ventas
                            </label>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="modo-mantenimiento">
                            <label class="form-check-label" for="modo-mantenimiento">
                                Activar modo mantenimiento (oculta la tienda a los clientes)
                            </label>
                        </div>

                        <div id="mensaje-configuracion" class="mt-3" role="alert"></div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-shopnow">Guardar cambios</button>
                            <button type="button" id="boton-restaurar" class="btn btn-outline-secondary">Restaurar valores por defecto</button>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
